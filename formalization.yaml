fidelity:
  divergences: >-
    Atoms are defined as idempotents of trace one (equivalent to the paper's primitive idempotents by
    the compared isAtom_iff_primitive), special subalgebras by embeddings into finite complex Hermitian
    matrices rather than operators on a Hilbert space, quaternionic Hilbert spaces as real Hilbert
    spaces with a right quaternion action and a quaternion-valued inner product, and representation
    states as linear functionals on all bounded operators over any RCLike field (for the real field not
    required to be symmetric, which changes no word value because word operators are self-adjoint).
    Relative to the printed statements, albert_criterion fixes d in {6, 24} and one family of
    projections for all states but restricts its third condition to carriers in Lean's lowest universe,
    least_separating_length restricts carriers to that universe, linear_separator_of_generates and
    least_separating_length do not mention algebraic models, no_representation_of_generates allows any
    rho in J, and headline hypotheses use Generates where the paper writes A > 0 (equivalent by
    fourPoint_criterion). The compared statements omit parts of the printed results that are proved
    without comparison or by hand: the rank and subalgebra data of three_atoms, zero_invariant_model and
    six_step_model, uniqueness of the maximiser in quadrupleM_spec, parts (ii) and (iv) of the four-point
    theorem, and the margin of Theorem 6.1(b); the Challenge does not state the Jordan identity for
    jordanMul, which the development proves.

